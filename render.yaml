# Render Blueprint for the Jobify API (free plan, single instance).
# Secrets are never stored here: Render asks for the `sync: false` values when you create the service.
services:
  - type: web
    name: jobify-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Deploys are manual on purpose: the container runs `alembic upgrade head` on start,
    # so every deploy can change the production database schema.
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "[]"
