# Local development stack. Credentials here are for local use only.
# Run from this folder:  docker compose up --build
name: jobify

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobify
      POSTGRES_PASSWORD: jobify
      POSTGRES_DB: jobify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jobify-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jobify-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ../backend
    environment: &backend_env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://jobify:jobify@postgres:5432/jobify
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-development-only-not-for-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    command: ["arq", "app.workers.settings.WorkerSettings"]
    environment: *backend_env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
